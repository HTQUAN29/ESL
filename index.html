<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hóa ESL – Từ vựng Hóa học</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f3f6f4; --ink:#17261f; --muted:#5d6e65; --line:#cfdad3; --accent:#1f6b4f; --mark:#ffe27a; --card:#fff; --onaccent:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111a16; --ink:#e6efe9; --muted:#93a79b; --line:#26372f; --accent:#6fd3a5; --mark:#5c4d12; --card:#17231d; --onaccent:#0c1a14; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.65 "Be Vietnam Pro", system-ui, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:48px 20px 80px; }
  .serif, h1, h2 { font-family:"Source Serif 4", Georgia, serif; }
  .ipa { font-family:"Noto Sans","Segoe UI","Charis SIL",system-ui,sans-serif; }
  h1.site { font-size:30px; margin:0; } h1.site a { color:inherit; text-decoration:none; }
  .tag { color:var(--muted); margin:2px 0 26px; }
  form { display:flex; gap:8px; }
  input { flex:1; min-width:0; padding:14px 16px; font:inherit; color:var(--ink); background:var(--card); border:1.5px solid var(--line); border-radius:10px; }
  button { padding:0 22px; font:500 16px "Be Vietnam Pro",sans-serif; cursor:pointer; color:var(--onaccent); background:var(--accent); border:0; border-radius:10px; }
  input:focus, button:focus-visible, a:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  ul.list { list-style:none; margin:14px 0 0; padding:0; }
  ul.list li a { display:flex; justify-content:space-between; gap:16px; padding:11px 4px; border-bottom:1px solid var(--line); color:var(--ink); text-decoration:none; }
  ul.list li a:hover { background:var(--card); }
  ul.list .en { color:var(--muted); text-align:right; }
  .count { color:var(--muted); font-size:14px; margin:26px 0 0; }
  .back { display:inline-block; margin:30px 0 10px; color:var(--accent); text-decoration:none; }
  h2.word { font-size:clamp(34px,8vw,52px); line-height:1.1; margin:0; display:inline; background:linear-gradient(transparent 62%,var(--mark) 62%); }
  .sub { font-size:22px; color:var(--muted); margin:10px 0 0; }
  .meta { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin:8px 0 0; color:var(--muted); }
  .pos { font-size:13px; padding:2px 10px; border:1.5px solid var(--accent); color:var(--accent); border-radius:99px; }
  .def { margin-top:26px; padding-top:16px; border-top:1px solid var(--line); }
  .def h3 { margin:0 0 4px; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); }
  .def p { margin:0; }
  figure { margin:26px 0 0; } figure img { max-width:100%; max-height:340px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px; }
  .src a { color:var(--accent); margin-right:14px; word-break:break-all; }
  .msg { color:var(--muted); margin-top:22px; }
</style>
</head>
<body>
<main>
  <h1 class="site serif"><a href="./">Hóa ESL</a></h1>
  <p class="tag">Từ vựng Hóa học song ngữ · Bilingual chemistry vocabulary</p>

  <form id="form" role="search">
    <input id="q" type="search" placeholder="Tìm từ / Search a word…" aria-label="Search" autocomplete="off">
    <button type="submit">Tìm</button>
  </form>

  <div id="view"></div>
</main>

<script src="entries.js"></script>
<script>
const norm = s => (s || "").replace(/đ/g, "d").replace(/Đ/g, "D").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const view = document.getElementById("view"), q = document.getElementById("q");
ENTRIES.forEach(e => { e.k1 = norm(e.vi + " " + e.en); e.k2 = norm(e.defVi + " " + e.defEn); });
const byName = (a, b) => a.vi.localeCompare(b.vi, "vi");

const row = e => `<li><a href="#${esc(e.id)}"><span>${esc(e.vi)}</span><span class="en">${esc(e.en)}</span></a></li>`;

function home() {
  document.title = "Hóa ESL – Từ vựng Hóa học";
  view.innerHTML = `<p class="count">${ENTRIES.length} từ · words (A–Z)</p><ul class="list">${[...ENTRIES].sort(byName).map(row).join("")}</ul>`;
}

function results(text) {
  const t = norm(text);
  const hits = ENTRIES.map(e => {
    const i = e.k1.indexOf(t);
    return { e, s: i === 0 ? 0 : i > 0 ? 1 : e.k2.includes(t) ? 2 : 9 };
  }).filter(h => h.s < 9).sort((a, b) => a.s - b.s || byName(a.e, b.e));
  view.innerHTML = hits.length
    ? `<p class="count">${hits.length} kết quả · results for “${esc(text)}”</p><ul class="list">${hits.map(h => row(h.e)).join("")}</ul>`
    : `<p class="msg">Không tìm thấy “${esc(text)}”. · No entry found.</p>`;
  return hits;
}

function show(e) {
  document.title = e.vi + " – Hóa ESL";
  const links = e.sources.map(s => {
    if (!s.url) return `<span>${esc(s.label)}</span> `;
    const label = s.label || new URL(s.url).hostname.replace(/^www\./, "");
    return `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(label)}</a>`;
  }).join("");
  view.innerHTML = `
    <a class="back" href="#">← Tất cả từ · All words</a>
    <div><h2 class="word">${esc(e.vi)}</h2></div>
    <p class="sub serif">${esc(e.en)}</p>
    <div class="meta">${e.ipa ? `<span class="ipa">${esc(e.ipa)}</span>` : ""}${e.pos ? `<span class="pos">${esc(e.pos)}</span>` : ""}</div>
    ${e.defVi ? `<div class="def"><h3>Định nghĩa</h3><p>${esc(e.defVi)}</p></div>` : ""}
    ${e.defEn ? `<div class="def"><h3>Definition</h3><p>${esc(e.defEn)}</p></div>` : ""}
    ${e.img ? `<figure><img src="${esc(e.img)}" alt="${esc(e.en)}"></figure>` : ""}
    ${links ? `<div class="def src"><h3>Nguồn · Source</h3>${links}</div>` : ""}`;
  window.scrollTo(0, 0);
}

function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  const e = ENTRIES.find(x => x.id === id);
  if (e) show(e); else if (q.value.trim()) results(q.value); else home();
}

document.getElementById("form").addEventListener("submit", ev => {
  ev.preventDefault();
  const text = q.value.trim();
  if (!text) { location.hash = ""; return home(); }
  const hits = results(text);
  const t = norm(text), exact = hits.find(h => norm(h.e.vi) === t || norm(h.e.en) === t);
  if (exact) location.hash = exact.e.id;
});
q.addEventListener("input", () => {
  if (location.hash) history.replaceState(null, "", location.pathname);
  if (q.value.trim()) results(q.value); else home();
});
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
